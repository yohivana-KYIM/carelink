stages:
  - test
  - deploy

variables:
  DOCKER_BUILDKIT: "1"

test:
  stage: test
  tags:
    - ecotocare-vps
  script:
    - docker run --rm -v "$CI_PROJECT_DIR":/app -w /app node:20-alpine sh -c "npm ci --no-audit --no-fund && npm run lint"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy:
  stage: deploy
  tags:
    - ecotocare-vps
  environment:
    name: production
    url: https://ecotocare.com
  script:
    - cp /etc/ecotocare/frontend.env .env
    - docker compose up -d --build
    - docker image prune -f
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
